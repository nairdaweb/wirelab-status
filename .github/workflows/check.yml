name: check

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run checks
        id: check
        run: python3 scripts/check.py

      - name: Commit results (on state change or hourly)
        if: steps.check.outputs.commit == 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "status: ${REASON}"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            # someone (the panel) pushed incidents.json meanwhile; our files never conflict with it
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Build site
        id: build
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # last, so a broken incidents.json still deploys (the page skips bad entries)
      # but the run turns red and GitHub e-mails the owner
      - name: Validate incidents.json
        run: python3 scripts/validate_incidents.py

  deploy:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.built == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
